<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Deposit Digital</title>
<link rel="stylesheet" href="tw.css">
</head>
<body>
<div id="lock" class="fixed inset-0 z-50 bg-neutral-950 flex flex-col items-center justify-center p-6 text-center">
 <div class="text-yellow-300 text-2xl font-bold neon">Deposit Digital</div>
 <div id="lt" class="mt-6 text-lg"></div><div id="lm" class="h-6 text-rose-400 text-sm"></div>
 <div id="lpad" class="mt-4"></div>
 <div class="mt-6 flex flex-col gap-3 text-sm text-yellow-200">
  <button id="lsw" class="hidden"></button>
  <button id="lcx" class="hidden underline">ยกเลิก</button>
  <label id="lrs" class="hidden underline cursor-pointer">กู้คืนจากไฟล์สำรอง<input id="rf" type="file" accept=".json" class="hidden"></label>
  <button id="lcs" class="hidden underline">กู้คืนจาก Google Sheets</button><button id="lcd" class="hidden underline">กู้คืนจาก Google Drive</button>
 </div>
</div>

<div id="app" class="hidden max-w-md mx-auto min-h-screen pb-28">
 <header class="flex items-center justify-between px-4 py-4 sticky top-0 bg-neutral-950/90 backdrop-blur z-20"><div class="flex items-center gap-3"><img src="icon-192.png" alt="" class="w-11 h-11 rounded-xl"><span class="text-2xl font-bold">Deposit Digital</span></div><div class="flex gap-3"><button id="eye" class="ib" aria-label="ซ่อนหรือแสดงยอดเงิน">👁️</button><button id="lk" class="ib" aria-label="ล็อกแอป">🔓</button></div></header>
 <main id="main" class="px-4"></main>
 <nav class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-zinc-950/95 border-t border-yellow-400/30 flex items-end justify-around px-2 pt-2" style="padding-bottom:calc(env(safe-area-inset-bottom) + .5rem)">
  <button data-p="home" class="nv flex-1 text-xs">🏠<br>หน้าแรก</button>
  <button data-p="acc" class="nv flex-1 text-xs">🏦<br>บัญชี</button>
  <button data-p="tx" class="nv flex-1 -mt-8"><span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-yellow-400 text-black text-3xl shadow-[0_0_20px_rgba(250,204,21,0.35)]">⇄</span><span class="text-xs">ธุรกรรม</span></button>
  <button data-p="sum" class="nv flex-1 text-xs">📊<br>สรุปยอด</button>
  <button data-p="set" class="nv flex-1 text-xs">⚙️<br>ตั้งค่า</button>
 </nav>
</div>
<div id="toast" class="fixed top-4 inset-x-4 z-[60] hidden text-center"><span class="btn inline-block"></span></div>
<div id="ctoast" class="hidden ct" role="alertdialog" aria-live="assertive"><div class="card hero ct-in"><div id="ctm" class="ct-m"></div><div class="ct-b"><button id="cty" class="btn ct-y">ลบ</button><button id="ctn" class="btn2">ยกเลิก</button></div></div></div>
<div id="upd" class="hidden fixed inset-x-4 z-[70] max-w-md mx-auto" style="bottom:calc(env(safe-area-inset-bottom) + 6.5rem)"><div class="card hero p-3 flex items-center justify-between gap-3 text-sm"><span>✨ มีเวอร์ชันใหม่พร้อมใช้งาน</span><button id="updb" class="btn !py-1.5">อัปเดต</button></div></div>

<script>
const VER='1.10.0';
const $=s=>document.querySelector(s), enc=new TextEncoder(), dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const baht=n=>{const v=Number(n||0);return(v<0?'-':'')+'฿'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,K,SALT,MODE,PAGE='home',FORM=null,TXF=null,IMP=null,TXD={},FT='all',FB='all',timer,syncT,BUSY=false,CT=null;
const DEF=()=>({banks:[],accts:[],txs:[],goal:{amt:0,mi:0},tax:{limit:20000},hide:false,autoLock:60,bp:'',sheets:{url:'',token:'',auto:false},lastBackup:null,open:{}});

async function dk(pw,salt,it=250000){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,key){if(obj==null)throw Error('no data');const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),data:b64(ct)}}
async function unseal(box,key){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(box.iv)},key,ub(box.data))))}
async function save(ns){const v={mode:MODE,salt:b64(SALT),it:IT,...await seal(S,K)};localStorage.setItem('dd_vault',JSON.stringify(v));
 clearTimeout(syncT);if(!ns&&S.sheets.auto&&S.bp&&S.sheets.url)syncT=setTimeout(()=>sendSheets(true),20000)}
function toast(t){const e=$('#toast');e.firstChild.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}

/* ---------- Lock UI ---------- */
function getSecret(mode,title,{canSwitch=false,restore=false,cancel=false,msg=''}={}){return new Promise(res=>{
 $('#lt').textContent=title;const pad=$('#lpad');pad.innerHTML='';$('#lm').textContent=msg||(canSwitch&&mode!=='pass'?'แนะนำ: รหัสผ่านข้อความ 8 ตัวอักษรขึ้นไป ปลอดภัยกว่า':'');
 const sw=$('#lsw');sw.classList.toggle('hidden',!canSwitch);
 if(canSwitch){sw.textContent='เปลี่ยนเป็น: '+LBL[NEXT[mode]];sw.onclick=()=>res({sw:1})}
 ['#lrs','#lcs','#lcd'].forEach(q=>$(q).classList.toggle('hidden',!restore));
 const cx=$('#lcx');cx.classList.toggle('hidden',!cancel);cx.onclick=()=>res({x:1});
 if(mode==='pass'){pad.onclick=null;pad.innerHTML='<input id="pp" type="password" autocomplete="off" class="text-center" placeholder="รหัสผ่านอย่างน้อย 8 ตัวอักษร"><button id="pb" class="btn w-full mt-3">ตกลง</button>';
  const go=()=>{const v=$('#pp').value;if(v.length<8)lockMsg('ต้องมีอย่างน้อย 8 ตัวอักษร');else res({s:v})};$('#pb').onclick=go;$('#pp').onkeydown=e=>e.key==='Enter'&&go()
 }else if(mode==='pin'){let v='';pad.innerHTML='<div id="pd" class="text-3xl tracking-[.5em] h-10 text-yellow-300"></div><div class="grid grid-cols-3 gap-3 w-64 mx-auto mt-3">'+
  [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-k="${k}">${k}</button>`).join('')+'</div>';
  pad.onclick=e=>{const k=e.target.dataset?.k;if(k==null)return;v=k==='⌫'?v.slice(0,-1):(v+k).slice(0,6);$('#pd').textContent='●'.repeat(v.length);if(v.length===6)setTimeout(()=>res({s:v}),80)}
 }else{let seq=[],on=false;pad.onclick=null;
  pad.innerHTML='<div id="pg" class="grid grid-cols-3 w-fit mx-auto" style="touch-action:none">'+[...Array(9).keys()].map(i=>`<div class="dot" data-i="${i}"></div>`).join('')+'</div><div class="text-xs text-zinc-400">ลากต่อจุดอย่างน้อย 4 จุด</div>';
  const g=$('#pg'),hit=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const i=el?.dataset?.i;if(i!=null&&!seq.includes(i)){seq.push(i);el.classList.add('on')}};
  g.onpointerdown=e=>{on=true;seq=[];g.querySelectorAll('.on').forEach(d=>d.classList.remove('on'));hit(e)};
  g.onpointermove=e=>{if(on)hit(e)};
  g.onpointerup=()=>{on=false;if(seq.length<4){lockMsg('ต้องต่ออย่างน้อย 4 จุด');seq=[];g.querySelectorAll('.on').forEach(d=>d.classList.remove('on'))}else res({s:seq.join('-')})}}
})}
function lockMsg(t){const m=$('#lm');m.textContent=t;$('#lpad').classList.remove('shake');void $('#lpad').offsetWidth;$('#lpad').classList.add('shake')}
async function setupLock(preset){let mode='pattern';
 for(;;){let r=await getSecret(mode,'ตั้งค่าการล็อกใหม่',{canSwitch:true,restore:!preset});
  if(r.sw){mode=NEXT[mode];continue}
  const r2=await getSecret(mode,'ยืนยันอีกครั้ง',{canSwitch:false});
  if(r2.s!==r.s){lockMsg('ไม่ตรงกัน ลองใหม่');await new Promise(r=>setTimeout(r,600));continue}
  MODE=mode;SALT=crypto.getRandomValues(new Uint8Array(16));IT=IT_NEW;K=await dk(r.s,SALT,IT);S=preset||DEF();await save();return}}
let fails=0;
async function unlock(v){MODE=v.mode;SALT=ub(v.salt);IT=v.it||250000;
 for(;;){const r=await getSecret(MODE,{pin:'กรอก PIN 6 หลัก',pass:'กรอกรหัสผ่าน',pattern:'วาดรูปแบบเพื่อปลดล็อก'}[MODE]);
  try{K=await dk(r.s,SALT,IT);S=Object.assign(DEF(),await unseal(v,K));$('#lm').textContent='';fails=0;
   if(IT<IT_NEW){SALT=crypto.getRandomValues(new Uint8Array(16));IT=IT_NEW;K=await dk(r.s,SALT,IT);await save()}return}
  catch(e){fails++;lockMsg('ไม่ถูกต้อง');if(fails>=3)await new Promise(z=>setTimeout(z,Math.min(30,(fails-2)*5)*1000))}}}
async function boot(){navigator.storage?.persist?.();const raw=localStorage.getItem('dd_vault');
 if(raw)await unlock(JSON.parse(raw));else await setupLock();
 $('#lock').classList.add('hidden');$('#app').classList.remove('hidden');render();arm()}
function lockNow(){if(!S)return;BUSY=false;if(CT)CT(false);S=null;K=null;IMP=null;$('#app').classList.add('hidden');$('#lock').classList.remove('hidden');boot()}

/* restore from file at lock screen */
async function lockRestore(b){try{if(!b.bp){localStorage.setItem('dd_vault',JSON.stringify(b));location.reload();return}
 const pw=prompt('ใส่รหัสผ่านสำรอง');const d=await unseal(b,await dk(pw,ub(b.salt),b.it||250000));
 await setupLock(Object.assign(DEF(),d));$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');render();arm()}catch(x){lockMsg('กู้คืนไม่สำเร็จ')}}
$('#rf').onchange=async e=>{const f=e.target.files[0];if(f)lockRestore(JSON.parse(await f.text()))};
$('#lcs').onclick=async()=>{const b=await cloud('sheet');b&&lockRestore(b)};$('#lcd').onclick=async()=>{const b=await cloud('drive');b&&lockRestore(b)};

/* auto-lock */
function arm(){clearTimeout(timer);if(S&&S.autoLock>0&&!BUSY)timer=setTimeout(lockNow,S.autoLock*1000)}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>S&&arm()));
document.addEventListener('visibilitychange',()=>{if(!S)return;$('#app').classList.toggle('hide',document.hidden||S.hide);if(document.hidden){if(S.sheets.auto&&S.bp&&S.sheets.url)sendSheets(true);if(S.autoLock>0)lockNow()}});

/* ---------- ยืนยันรหัส + toast ยืนยัน ---------- */
async function verifyCode(title){BUSY=true;clearTimeout(timer);let bad=0;
 try{for(;;){$('#lock').classList.remove('hidden');
  const r=await getSecret(MODE,title||'ยืนยันรหัสก่อนดำเนินการ',{cancel:true,msg:bad?'รหัสไม่ถูกต้อง':''});
  if(r.x)return false;
  try{await unseal(JSON.parse(localStorage.getItem('dd_vault')),await dk(r.s,SALT,IT));return true}
  catch(e){bad++;if(bad>=3)await new Promise(z=>setTimeout(z,Math.min(30,(bad-2)*5)*1000))}}
 }finally{if(S){$('#lock').classList.add('hidden');$('#lm').textContent='';BUSY=false;arm()}}}
function confirmToast(msg,ok='ลบ'){return new Promise(res=>{if(CT)CT(false);
 const e=$('#ctoast');$('#ctm').textContent=msg;$('#cty').textContent=ok;e.classList.remove('hidden');let tm;
 const done=v=>{clearTimeout(tm);e.classList.add('hidden');CT=null;res(v)};
 CT=done;$('#cty').onclick=()=>done(true);$('#ctn').onclick=()=>done(false);tm=setTimeout(()=>done(false),10000)})}

/* ---------- Pages ---------- */
function soon(t){return`<div class="card p-10 mt-6 text-center"><div class="text-4xl neon">🚧</div><div class="mt-3 text-xl text-yellow-300">${t}</div><div class="text-zinc-400 mt-1">Coming soon</div></div>`}
function card(id,title,inner){const o=(id==='closed'||id==='clr')?S.open[id]===true:S.open[id]!==false;return`<section class="card mb-3 ${o?'open':''}" data-c="${id}"><button class="hd w-full flex justify-between items-center p-4 text-left text-yellow-300 font-bold"><span>${title}</span><span class="chev">▾</span></button><div class="body px-4 pb-4 text-sm space-y-3">${inner}</div></section>`}
function settings(){
 const banks=S.banks.map((b,i)=>`<div class="flex justify-between items-center bg-zinc-900 rounded-lg p-2"><div><div class="font-semibold">${esc(b.name)}</div><div class="text-xs text-zinc-400">${esc(b.product)}</div></div><button data-del="${i}" class="text-rose-400 px-2">ลบ</button></div>`).join('')||'<div class="text-zinc-500">ยังไม่มีรายการ</div>';
 return card('bank','ตั้งค่าธนาคารและผลิตภัณฑ์',`${banks}<input id="bn" placeholder="ชื่อธนาคาร"><input id="bp" placeholder="ผลิตภัณฑ์ เช่น ออมทรัพย์, ฝากประจำ"><button id="addb" class="btn w-full">เพิ่มรายการ</button>`)
 +card('tax','ตั้งค่าเงื่อนไขการเสียภาษี',`<div class="text-zinc-300">รวมทุกธนาคาร ดอกเบี้ยเกิน <b class="text-yellow-300 amt">${baht(S.tax.limit)}</b></div><label class="block">เกณฑ์ดอกเบี้ย (฿)<input id="tl" type="number" step="0.01" value="${S.tax.limit}"></label><label class="block">อัตราหัก ณ ที่จ่ายที่คาดไว้ (%)<input id="tr" type="number" step="0.01" min="0" value="${taxRate()}"></label><button id="stl" class="btn w-full">บันทึก</button>`)
 +card('goal','เป้าเงินฝากสะสม',`<label class="block">เป้ายอดฝากรวม (฿)<input id="gt" type="number" step="0.01" min="0" value="${S.goal.amt||''}"></label><label class="block">ดอกเบี้ยต่อเดือนที่ใช้คำนวณ (฿) เว้นว่าง = ใช้ค่าเฉลี่ยจริง<input id="gm" type="number" step="0.01" min="0" value="${S.goal.mi||''}"></label><button id="sgl" class="btn w-full">บันทึกเป้า</button>`)
 +card('priv','ความเป็นส่วนตัว',`<label class="flex justify-between items-center">ซ่อนยอดเงิน<input id="hd" type="checkbox" class="!w-5 !h-5" ${S.hide?'checked':''}></label>
 <label class="block">ล็อกอัตโนมัติหลังไม่ใช้งาน<select id="al">${[[0,'ไม่ล็อก'],[30,'30 วินาที'],[60,'1 นาที'],[300,'5 นาที'],[900,'15 นาที']].map(([v,t])=>`<option value="${v}" ${S.autoLock==v?'selected':''}>${t}</option>`).join('')}</select></label>
 <button id="chg" class="btn2 w-full">เปลี่ยน PIN / รูปแบบ</button>`)
 +card('stat','สถานะการตั้งระบบ',`<div>เวอร์ชัน: <b>${VER}</b></div><div>เข้ารหัส: AES-256-GCM (PBKDF2)</div><div>วิธีล็อก: ${LBL[MODE]} · PBKDF2 ${IT/1000}k รอบ</div><div>ออนไลน์: ${navigator.onLine?'ใช่':'ไม่'}</div><div>Service Worker: ${'serviceWorker' in navigator&&navigator.serviceWorker.controller?'ทำงานอยู่':'ยังไม่ทำงาน'}</div><div>สำรองล่าสุด: ${S.lastBackup?new Date(S.lastBackup).toLocaleString('th-TH'):'ยังไม่เคย'}${!S.lastBackup||Date.now()-S.lastBackup>2592e6?' ⚠️ ควรสำรองใหม่':''}</div><button id="cu" class="btn2 w-full">🔄 ตรวจหาเวอร์ชันใหม่</button>`)
 +card('bak','สำรอง / กู้คืน',`<button id="bk" class="btn w-full">💾 สำรองข้อมูล (บันทึกลงเครื่อง)</button>
 <label class="btn2 block text-center cursor-pointer">กู้คืนจากไฟล์สำรอง<input id="rs" type="file" accept=".json" class="hidden"></label>
 <div class="border-t border-yellow-400/20 pt-3 space-y-2"><div class="text-yellow-200">Google Sheets</div>
 <input id="su" class="blurf" autocomplete="off" spellcheck="false" placeholder="URL ของสคริปต์" value="${esc(S.sheets.url)}"><input id="st" class="blurf" autocomplete="off" spellcheck="false" placeholder="Token (ยาวอย่างน้อย 24 ตัวอักษร)" value="${esc(S.sheets.token)}"><div class="text-xs text-zinc-500">URL และ Token ถูกเบลอ แตะช่องเพื่อดู/แก้ไข · การบันทึกค่าต้องใส่รหัสยืนยัน</div><button id="mkt" class="btn2 w-full">🎲 สร้าง Token สุ่ม (256 บิต)</button><input id="sp" type="password" placeholder="รหัสผ่านสำรอง (แยกจาก PIN)" value="${esc(S.bp)}">
 <label class="flex justify-between items-center">สำรองอัตโนมัติขึ้นชีต<input id="sa" type="checkbox" class="!w-5 !h-5" ${S.sheets.auto?'checked':''}></label>
 <div class="flex gap-2"><button id="ss" class="btn2 flex-1">บันทึกค่า</button><button id="sn" class="btn flex-1">ส่งขึ้นชีต</button></div>
 <button id="sd" class="btn w-full">☁️ บันทึกลง Google Drive</button><div class="flex gap-2"><button id="rcs" class="btn2 flex-1">กู้คืนจากชีต</button><button id="rcd" class="btn2 flex-1">กู้คืนจาก Drive</button></div>
 <div class="text-xs text-zinc-400">จดรหัสผ่านสำรองไว้ ลืม = กู้คืนจากชีตไม่ได้</div></div>`)
 +card('imp','นำเข้าข้อมูลจาก CSV',`<div class="text-zinc-300">นำเข้าธุรกรรมย้อนหลังจากไฟล์ CSV (UTF-8) เลือกไฟล์แล้วระบบจะพาไปหน้า “ตรวจก่อนนำเข้า” ในหน้าธุรกรรม</div>
 <label class="btn2 block text-center cursor-pointer">📥 นำเข้า CSV<input id="imf" type="file" accept=".csv,.txt,text/csv" class="hidden"></label>
 <button id="imt" class="btn2 w-full">📄 ไฟล์ตัวอย่าง</button>`)
 +card('clr','เคลียร์ข้อมูล',`<div class="text-zinc-300">ลบบัญชี ธุรกรรม ธนาคาร/ผลิตภัณฑ์ เป้าหมาย และเกณฑ์ภาษีทั้งหมด (ไม่ลบรหัสล็อกและค่า Google Sheets) กู้คืนไม่ได้ ควรสำรองข้อมูลก่อน และต้องใส่รหัสยืนยัน</div>
 <button id="clr" class="dng w-full">🗑️ เคลียร์ข้อมูลทั้งหมด</button>`)
}

function bindCards(){if($('#rfb'))$('#rfb').onclick=refreshPage;if($('#gs'))$('#gs').onclick=()=>{PAGE='set';render()};document.querySelectorAll('.hd').forEach(h=>h.onclick=()=>{const c=h.parentElement;c.classList.toggle('open');S.open[c.dataset.c]=c.classList.contains('open');save()})}
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5),dsince=d=>Math.max(1,dd(d,today())),act=()=>S.accts.filter(a=>!a.closed),dsA=a=>Math.max(1,dd(a.since,a.closed||today()));
const avgBal=a=>{const st=a.since,en=a.closed||today(),T=Math.max(1,dd(st,en));let cur=0,prev=st,area=0;
 S.txs.filter(t=>t.acct===a.id||t.to===a.id).sort((x,y)=>x.date.localeCompare(y.date)).forEach(t=>{const d=t.date<st?st:t.date;area+=cur*Math.max(0,dd(prev,d));cur+=dl(t,a.id);if(d>prev)prev=d});
 return(area+cur*Math.max(0,dd(prev,en)))/T};
const rate=a=>{const v=avgBal(a);return v>0&&a.since?ia(a)*365/dsA(a)/v*100:null};
const pct=r=>r==null?'-':r.toFixed(2)+'%';
function accForm(){const e=FORM>=0?S.accts[FORM]:{};
 if(!S.banks.length)return`<div class="card p-4 mb-3 text-sm">ต้องเพิ่มธนาคารและผลิตภัณฑ์ที่หน้าตั้งค่าก่อน<button id="fg" class="btn w-full mt-3">ไปที่ตั้งค่า</button><button id="fc" class="btn2 w-full mt-2">ยกเลิก</button></div>`;
 const cur=S.banks.findIndex(b=>b.name===e.bank&&b.product===e.product);

function parseCSV(t){t=t.replace(/^\uFEFF/,'');const f=t.split(/\r?\n/,1)[0],d=f.includes('\t')?'\t':(f.split(';').length>f.split(',').length?';':',');

  else if(ch==='"')q=true;
  else if(ch===d){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
